<!--
  Wazuh Agent Configuration for VM 2 (Web Target & WAF Host)
  Target file on VM 2: /var/ossec/etc/ossec.conf
-->
<ossec_config>
  <client>
    <server>
      <address>192.168.1.30</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>ubuntu, debian</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- ModSecurity Single-line JSON Audit Log Ingestion -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/modsec/modsec_audit.log</location>
  </localfile>

  <!-- Optional: Ingest Nginx standard access logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

  <!-- Active Response Configuration on Agent -->
  <active-response>
    <disabled>no</disabled>
    <ca_store>/var/ossec/etc/wpk_root.pem</ca_store>
    <ca_verification>yes</ca_verification>
  </active-response>
</ossec_config>

