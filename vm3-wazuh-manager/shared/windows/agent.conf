<!--
  Centralized configuration for agent group "windows" (VM 4 - Windows 10 client)
  File location on Wazuh Manager (VM 3): /var/ossec/etc/shared/windows/agent.conf

  Security / System / Application channels are already collected by the default
  Windows agent ossec.conf; this file adds the extra channels needed by windows_rules.xml.
-->
<agent_config os="Windows">

  <!-- Sysmon: process creation, network connections, registry, ... -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- PowerShell Script Block Logging (Event 4104) -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Microsoft Defender Antivirus detections -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

</agent_config>
