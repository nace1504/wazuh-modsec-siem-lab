services:
  modsec-waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: modsec-waf
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - BACKEND=http://dvwa:80
      - PORT=8080
      - MODSEC_RULE_ENGINE=on
      - MODSEC_AUDIT_ENGINE=RelevantOnly
      - MODSEC_AUDIT_LOG=/var/log/modsec/modsec_audit.log
      - MODSEC_AUDIT_LOG_FORMAT=JSON
      - MODSEC_AUDIT_LOG_TYPE=Serial
      - MODSEC_AUDIT_LOG_PARTS=ABIJDEFHZ
      - MODSEC_AUDIT_LOG_RELEVANT_STATUS=^(?:5|4(?!04))
    volumes:
      - /var/log/modsec:/var/log/modsec
    depends_on:
      - dvwa
    networks:
      - target-net

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: dvwa-app
    restart: unless-stopped
    environment:
      - PHP_SECURITY_LEVEL=low
    volumes:
      - ./docker/dvwa/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - target-net

networks:
  target-net:
    driver: bridge

