# =============================================================================
# ModSecurity Core Configuration & Single-line JSON Audit Log for Wazuh SIEM
# =============================================================================

# Enable WAF Rule Engine (On: Block & Log | DetectionOnly: Only Log)
SecRuleEngine On

# Request & Response inspection
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyInMemoryLimit 131072
SecRequestBodyLimitAction Reject

SecResponseBodyAccess Off
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 1048576

# Temporary and Data storage paths
SecTmpDir /tmp/
SecDataDir /tmp/

# =============================================================================
# Audit Log Configuration (Single-line JSON for Wazuh Agent localfile ingestion)
# =============================================================================
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec/modsec_audit.log
SecAuditLogFormat JSON

# Default action when rule triggers
SecDefaultAction "phase:1,log,auditlog,deny,status:403"
SecDefaultAction "phase:2,log,auditlog,deny,status:403"

# =============================================================================
# Include OWASP Core Rule Set (CRS v4)
# =============================================================================
Include /opt/owasp-crs/crs-setup.conf
Include /opt/owasp-crs/rules/*.conf

